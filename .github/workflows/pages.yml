# 정상 릴리즈 시의 Pages 배포는 release.yml 의 pages 잡이 담당한다.
# 이 워크플로는 인덱스를 수동으로 다시 생성해야 할 때만 사용한다.
name: Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      # 한 id 당 한 항목만 유지해야 업데이트 설치가 정상 동작한다. (release.yml 주석 참고)
      - name: Download latest release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf remote_repo
          mkdir -p remote_repo
          gh release download --pattern "*.zip" --dir remote_repo --clobber
      - name: Generate index
        run: blender --background --factory-startup --command extension server-generate --repo-dir remote_repo --html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote_repo
      - id: deployment
        uses: actions/deploy-pages@v4
