name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      - name: Build
        run: python3 scripts/build_release.py
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
