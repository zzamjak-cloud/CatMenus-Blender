name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      - name: Build
        run: python3 scripts/build_release.py
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # GITHUB_TOKEN으로 만든 릴리즈는 release 이벤트를 트리거하지 않으므로
  # Pages 배포를 릴리즈 워크플로 안에서 직접 이어서 수행한다.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      - name: Download release zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p remote_repo
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            gh release download "$tag" --pattern "*.zip" --dir remote_repo --clobber
          done
      - name: Generate index
        run: blender --background --factory-startup --command extension server-generate --repo-dir remote_repo --html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote_repo
      - id: deployment
        uses: actions/deploy-pages@v4
