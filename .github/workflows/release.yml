name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      - name: Build
        run: python3 scripts/build_release.py
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # GITHUB_TOKEN으로 만든 릴리즈는 release 이벤트를 트리거하지 않으므로
  # Pages 배포를 릴리즈 워크플로 안에서 직접 이어서 수행한다.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        uses: moguri/setup-blender@v1
        with:
          blender-version: "4.2"
      # index.json 에 같은 id 가 두 번 이상 들어가면 Blender 가 표시용으로는
      # 마지막 항목(최신)을, 설치용으로는 첫 항목(구버전)을 골라
      # 업데이트 버튼을 눌러도 같은 버전이 재설치된다.
      # 따라서 이번에 릴리즈한 zip 하나만 인덱싱한다.
      - name: Download release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf remote_repo
          mkdir -p remote_repo
          gh release download "${GITHUB_REF_NAME}" --pattern "*.zip" --dir remote_repo --clobber
      - name: Generate index
        run: blender --background --factory-startup --command extension server-generate --repo-dir remote_repo --html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote_repo
      - id: deployment
        uses: actions/deploy-pages@v4
